name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # github.repository_owner ja e lowercase; github.event.repository.name preserva case do repo
  # mas GHCR aceita case-insensitive no nome do repo — apenas o owner precisa ser lowercase
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend
  IMAGE_NGINX:    ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/nginx

jobs:
  # ─────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Run unit tests
        run: ./mvnw test -Dspring.profiles.active=test
      - name: Run integration tests (Testcontainers)
        run: ./mvnw verify -Pfailsafe -Dspring.profiles.active=test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  # ─────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.IMAGE_FRONTEND }}:latest
          no-cache: true

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ env.IMAGE_NGINX }}:${{ github.sha }},${{ env.IMAGE_NGINX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via SSH + Smoke Test
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          TRUSTED_PROXY_IP: ${{ secrets.TRUSTED_PROXY_IP }}
          # GHCR_REPO em lowercase (obrigatorio pelo GHCR) — github.repository_owner ja e lowercase
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # command_timeout: tempo máximo por conexão SSH (deploy + smoke test)
          command_timeout: 12m
          envs: DATABASE_URL,JWT_SECRET,NEXT_PUBLIC_API_URL,CORS_ALLOWED_ORIGINS,DOMAIN,TRUSTED_PROXY_IP,GHCR_REPO,IMAGE_TAG,DEPLOY_TOKEN,DEPLOY_ACTOR,GH_REPOSITORY
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /opt/prd-gra
            cd /opt/prd-gra

            # Atualizar docker-compose.yml via git clone do repositório (evita SCP)
            # GH_REPOSITORY = "claudiofxbr/prd-gra.ng" (owner/repo)
            git clone --depth=1 --branch=main \
              https://x-access-token:${DEPLOY_TOKEN}@github.com/${GH_REPOSITORY}.git \
              /tmp/prd-gra-repo 2>/dev/null || true
            if [ -f /tmp/prd-gra-repo/docker-compose.yml ]; then
              cp /tmp/prd-gra-repo/docker-compose.yml /opt/prd-gra/docker-compose.yml
              rm -rf /tmp/prd-gra-repo
            fi

            # Gravar .env com valores entre aspas duplas — obrigatório para preservar '#' em senhas
            # (Docker Compose interpreta '#' sem aspas como comentário no .env).
            # printf %s garante que '%' em valores não seja interpretado como diretiva de formato.
            ENV_FILE=/opt/prd-gra/.env
            {
              printf 'DATABASE_URL="%s"\n'          "$DATABASE_URL"
              printf 'JWT_SECRET="%s"\n'             "$JWT_SECRET"
              printf 'NEXT_PUBLIC_API_URL="%s"\n'    "$NEXT_PUBLIC_API_URL"
              printf 'CORS_ALLOWED_ORIGINS="%s"\n'   "$CORS_ALLOWED_ORIGINS"
              printf 'DOMAIN="%s"\n'                 "$DOMAIN"
              printf 'TRUSTED_PROXY_IP="%s"\n'       "$TRUSTED_PROXY_IP"
              printf 'GHCR_REPO="%s"\n'              "$GHCR_REPO"
              printf 'IMAGE_TAG="%s"\n'              "$IMAGE_TAG"
            } > "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            # Login no GHCR
            echo "$DEPLOY_TOKEN" | docker login ghcr.io -u "$DEPLOY_ACTOR" --password-stdin

            # Registrar imagem atual do backend para rollback (trata primeiro deploy sem container)
            # Captura o SHA da imagem em execução ANTES do pull — o pull sobrescreve :latest
            PREVIOUS_SHA=""
            BACKEND_CID=$(docker compose ps -q backend 2>/dev/null || true)
            if [ -n "$BACKEND_CID" ]; then
              RUNNING_IMAGE=$(docker inspect --format='{{index .Config.Image}}' "$BACKEND_CID" 2>/dev/null || echo "")
              # Extrai o SHA do formato ghcr.io/owner/repo/backend:<sha> — usa apenas hex lowercase
              PREVIOUS_SHA=$(echo "$RUNNING_IMAGE" | grep -oE '[0-9a-f]{40}$' || echo "")
            fi

            # Pull das novas imagens
            docker compose --env-file "$ENV_FILE" pull

            # Rolling deploy
            docker compose --env-file "$ENV_FILE" up -d --remove-orphans

            # ── Smoke test backend ─────────────────────────────────────────
            # Executa wget DENTRO do container (isola falhas de TLS/DNS/rede externa)
            echo "Aguardando backend iniciar (max 60s)..."
            SUCCESS=false
            for i in $(seq 1 20); do
              STATUS=$(docker compose exec -T backend \
                wget -qO- http://localhost:8080/api/actuator/health 2>/dev/null \
                | grep -o '"status":"[^"]*"' | head -1 || echo "")
              if echo "$STATUS" | grep -q '"UP"'; then
                echo "Backend smoke test aprovado na tentativa $i."
                SUCCESS=true
                break
              fi
              echo "Tentativa $i: $STATUS — aguardando 3s..."
              sleep 3
            done

            # ── Smoke test frontend ────────────────────────────────────────
            # Executa wget DENTRO do container frontend (porta interna 3000, sem depender do nginx)
            echo "Verificando frontend no sub-path /prd-gra.ng/ ..."
            FRONT_OK=false
            for i in $(seq 1 10); do
              HTTP_CODE=$(docker compose exec -T frontend \
                wget -qO /dev/null --server-response http://127.0.0.1:3000/prd-gra.ng/ 2>&1 \
                | grep "HTTP/" | tail -1 | awk '{print $2}' || echo "")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Frontend OK (HTTP 200) na tentativa $i."
                FRONT_OK=true
                break
              fi
              echo "Tentativa $i: HTTP $HTTP_CODE — aguardando 3s..."
              sleep 3
            done
            if [ "$FRONT_OK" = "false" ]; then
              echo "AVISO: frontend nao respondeu no sub-path — verificando logs..."
              docker compose logs --tail=50 frontend || true
            fi

            # ── Rollback se backend falhou ─────────────────────────────────
            if [ "$SUCCESS" = "false" ]; then
              echo "Smoke test FALHOU. Iniciando rollback..."
              docker compose logs --tail=100 backend || true
              if [ -n "$PREVIOUS_SHA" ]; then
                echo "Revertendo para SHA anterior: ${PREVIOUS_SHA}"
                # Reescreve o .env completo com IMAGE_TAG anterior (evita sed in-place com regex frágil)
                {
                  printf 'DATABASE_URL="%s"\n'          "$DATABASE_URL"
                  printf 'JWT_SECRET="%s"\n'             "$JWT_SECRET"
                  printf 'NEXT_PUBLIC_API_URL="%s"\n'    "$NEXT_PUBLIC_API_URL"
                  printf 'CORS_ALLOWED_ORIGINS="%s"\n'   "$CORS_ALLOWED_ORIGINS"
                  printf 'DOMAIN="%s"\n'                 "$DOMAIN"
                  printf 'TRUSTED_PROXY_IP="%s"\n'       "$TRUSTED_PROXY_IP"
                  printf 'GHCR_REPO="%s"\n'              "$GHCR_REPO"
                  printf 'IMAGE_TAG="%s"\n'              "$PREVIOUS_SHA"
                } > "$ENV_FILE"
                chmod 600 "$ENV_FILE"
                docker compose --env-file "$ENV_FILE" pull
                docker compose --env-file "$ENV_FILE" up -d --remove-orphans
                echo "Rollback para ${PREVIOUS_SHA} concluido."
              else
                echo "Nenhuma versao anterior disponivel para rollback (primeiro deploy ou SHA nao identificado)."
              fi
              exit 1
            fi

            # Limpeza de imagens antigas (mantém ultimas 72h)
            docker image prune -f --filter "until=72h"
            echo "Deploy concluido com sucesso: SHA=$IMAGE_TAG"
