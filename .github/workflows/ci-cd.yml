name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  # GHCR requer lowercase — github.repository ja e lowercase por padrao
  IMAGE_BACKEND:  ghcr.io/${{ github.repository }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository }}/frontend
  IMAGE_NGINX:    ghcr.io/${{ github.repository }}/nginx

jobs:
  # ─────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Run unit tests
        run: mvn test -Dspring.profiles.active=test
      - name: Run integration tests (Testcontainers)
        run: mvn verify -Pfailsafe
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/

  # ─────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          push: true
          tags: ${{ env.IMAGE_NGINX }}:${{ github.sha }},${{ env.IMAGE_NGINX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via SSH + Smoke Test
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Copy docker-compose to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "docker-compose.yml"
          target: "/opt/prd-gra"

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          TRUSTED_PROXY_IP: ${{ secrets.TRUSTED_PROXY_IP }}
          # GHCR_REPO em lowercase (obrigatorio pelo GHCR)
          GHCR_REPO: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DATABASE_URL,JWT_SECRET,NEXT_PUBLIC_API_URL,CORS_ALLOWED_ORIGINS,DOMAIN,TRUSTED_PROXY_IP,GHCR_REPO,IMAGE_TAG,DEPLOY_TOKEN,DEPLOY_ACTOR
          script: |
            set -euo pipefail
            cd /opt/prd-gra

            # Gravar .env via printf — evita problemas de indentacao de heredoc no YAML
            printf 'DATABASE_URL=%s\nJWT_SECRET=%s\nNEXT_PUBLIC_API_URL=%s\nCORS_ALLOWED_ORIGINS=%s\nDOMAIN=%s\nTRUSTED_PROXY_IP=%s\nGHCR_REPO=%s\nIMAGE_TAG=%s\n' \
              "$DATABASE_URL" \
              "$JWT_SECRET" \
              "$NEXT_PUBLIC_API_URL" \
              "$CORS_ALLOWED_ORIGINS" \
              "$DOMAIN" \
              "$TRUSTED_PROXY_IP" \
              "$GHCR_REPO" \
              "$IMAGE_TAG" \
              > /opt/prd-gra/.env
            chmod 600 /opt/prd-gra/.env

            # Login no GHCR
            echo "$DEPLOY_TOKEN" | docker login ghcr.io -u "$DEPLOY_ACTOR" --password-stdin

            # Registrar imagem atual do backend para rollback (trata primeiro deploy sem container)
            BACKEND_CID=$(docker compose ps -q backend 2>/dev/null || true)
            if [ -n "$BACKEND_CID" ]; then
              PREVIOUS_TAG=$(docker inspect --format='{{index .Config.Image}}' "$BACKEND_CID" 2>/dev/null || echo "")
            else
              PREVIOUS_TAG=""
            fi

            # Pull das novas imagens
            docker compose --env-file /opt/prd-gra/.env pull

            # Rolling deploy
            docker compose --env-file /opt/prd-gra/.env up -d --remove-orphans

            # Smoke test: aguardar backend via health endpoint interno (sem depender de TLS/nginx)
            # Usa curl direto no container para isolar falhas de TLS/DNS
            echo "Aguardando backend iniciar (max 60s)..."
            SUCCESS=false
            for i in $(seq 1 20); do
              STATUS=$(docker compose exec -T backend \
                wget -qO- http://localhost:8080/api/actuator/health 2>/dev/null \
                | grep -o '"status":"[^"]*"' | head -1 || echo "")
              if echo "$STATUS" | grep -q '"UP"'; then
                echo "Smoke test aprovado na tentativa $i (backend UP)."
                SUCCESS=true
                break
              fi
              echo "Tentativa $i: $STATUS — aguardando 3s..."
              sleep 3
            done

            if [ "$SUCCESS" = "false" ]; then
              echo "Smoke test FALHOU. Iniciando rollback..."
              if [ -n "$PREVIOUS_TAG" ]; then
                # Extrair SHA com sed (portavel — nao usa grep -oP/PCRE)
                PREV_SHA=$(echo "$PREVIOUS_TAG" | sed 's/.*:\([a-f0-9]*\)$/\1/')
                if [ -n "$PREV_SHA" ] && [ "$PREV_SHA" != "$PREVIOUS_TAG" ]; then
                  sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV_SHA}/" /opt/prd-gra/.env
                  docker compose --env-file /opt/prd-gra/.env pull
                  docker compose --env-file /opt/prd-gra/.env up -d --remove-orphans
                  echo "Rollback para ${PREV_SHA} concluido."
                else
                  echo "SHA anterior nao identificado em: $PREVIOUS_TAG"
                fi
              else
                echo "Nenhuma versao anterior disponivel para rollback (primeiro deploy)."
              fi
              exit 1
            fi

            # Limpeza de imagens antigas (mantém ultimas 72h)
            docker image prune -f --filter "until=72h"
            echo "Deploy concluido: SHA=$IMAGE_TAG"
