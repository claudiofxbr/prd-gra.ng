name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  # Opt-in antecipado ao Node.js 24 para GitHub Actions (obrigatório a partir de 16/06/2026)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  REGISTRY: ghcr.io
  # github.repository_owner ja e lowercase; github.event.repository.name preserva case do repo
  # mas GHCR aceita case-insensitive no nome do repo — apenas o owner precisa ser lowercase
  IMAGE_BACKEND:  ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/frontend
  IMAGE_NGINX:    ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/nginx

jobs:
  # ─────────────────────────────────────────────────────────────
  lint-frontend:
    name: Lint & TypeScript Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ─────────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (Unit + Integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
      - name: Run unit tests
        run: ./mvnw test -Dspring.profiles.active=test
      - name: Run integration tests (Testcontainers)
        run: ./mvnw verify -Pfailsafe -Dspring.profiles.active=test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore

  # ─────────────────────────────────────────────────────────────
  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [lint-frontend, test-backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_BACKEND }}:${{ github.sha }},${{ env.IMAGE_BACKEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ env.IMAGE_FRONTEND }}:${{ github.sha }},${{ env.IMAGE_FRONTEND }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push nginx
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ env.IMAGE_NGINX }}:${{ github.sha }},${{ env.IMAGE_NGINX }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via SSH + Smoke Test
    runs-on: ubuntu-latest
    needs: build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          CORS_ALLOWED_ORIGINS: ${{ secrets.CORS_ALLOWED_ORIGINS }}
          DOMAIN: ${{ secrets.DOMAIN }}
          TRUSTED_PROXY_IP: ${{ secrets.TRUSTED_PROXY_IP }}
          # GHCR_REPO em lowercase (obrigatorio pelo GHCR) — github.repository_owner ja e lowercase
          GHCR_REPO: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.sha }}
          DEPLOY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_ACTOR: ${{ github.actor }}
          GH_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # command_timeout: tempo máximo total da sessão SSH
          command_timeout: 12m
          envs: DATABASE_URL,JWT_SECRET,NEXT_PUBLIC_API_URL,CORS_ALLOWED_ORIGINS,DOMAIN,TRUSTED_PROXY_IP,GHCR_REPO,IMAGE_TAG,DEPLOY_TOKEN,DEPLOY_ACTOR,GH_REPOSITORY
          script_stop: true
          script: |
            set -euo pipefail

            # Validação de secrets obrigatórios antes de qualquer ação destrutiva
            if [ -z "$DATABASE_URL" ] || [ -z "$JWT_SECRET" ]; then
              echo "ERRO: DATABASE_URL ou JWT_SECRET ausentes — abortando deploy."
              exit 1
            fi
            if ! echo "$DATABASE_URL" | grep -qiE 'sslmode=require|sslmode=verify'; then
              echo "AVISO: DATABASE_URL não contém sslmode=require. Conexão com Neon pode ser insegura."
            fi

            mkdir -p /opt/prd-gra
            cd /opt/prd-gra

            # Atualizar docker-compose.yml via git clone do repositório (evita SCP)
            # GH_REPOSITORY = "claudiofxbr/prd-gra.ng" (owner/repo)
            git clone --depth=1 --branch=main \
              https://x-access-token:${DEPLOY_TOKEN}@github.com/${GH_REPOSITORY}.git \
              /tmp/prd-gra-repo 2>/dev/null || true
            if [ -f /tmp/prd-gra-repo/docker-compose.yml ]; then
              cp /tmp/prd-gra-repo/docker-compose.yml /opt/prd-gra/docker-compose.yml
              rm -rf /tmp/prd-gra-repo
            fi

            # Gravar .env com valores entre aspas duplas — obrigatório para preservar '#' em senhas
            # (Docker Compose interpreta '#' sem aspas como comentário no .env).
            # printf %s garante que '%' em valores não seja interpretado como diretiva de formato.
            ENV_FILE=/opt/prd-gra/.env
            {
              printf 'DATABASE_URL="%s"\n'          "$DATABASE_URL"
              printf 'JWT_SECRET="%s"\n'             "$JWT_SECRET"
              printf 'NEXT_PUBLIC_API_URL="%s"\n'    "$NEXT_PUBLIC_API_URL"
              printf 'CORS_ALLOWED_ORIGINS="%s"\n'   "$CORS_ALLOWED_ORIGINS"
              printf 'DOMAIN="%s"\n'                 "$DOMAIN"
              printf 'TRUSTED_PROXY_IP="%s"\n'       "$TRUSTED_PROXY_IP"
              printf 'GHCR_REPO="%s"\n'              "$GHCR_REPO"
              printf 'IMAGE_TAG="%s"\n'              "$IMAGE_TAG"
            } > "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            # Login no GHCR
            echo "$DEPLOY_TOKEN" | docker login ghcr.io -u "$DEPLOY_ACTOR" --password-stdin

            # Registrar imagem atual do backend para rollback (trata primeiro deploy sem container)
            # Captura o SHA da imagem em execução ANTES do pull — o pull sobrescreve :latest
            PREVIOUS_SHA=""
            set +e
            BACKEND_CID=$(docker compose ps -q backend 2>/dev/null)
            if [ -n "$BACKEND_CID" ]; then
              RUNNING_IMAGE=$(docker inspect --format='{{index .Config.Image}}' "$BACKEND_CID" 2>/dev/null)
              # Extrai o SHA do formato ghcr.io/owner/repo/backend:<sha> — usa apenas hex lowercase
              PREVIOUS_SHA=$(echo "$RUNNING_IMAGE" | grep -oE '[0-9a-f]{40}$')
            fi
            set -e

            # Pull das novas imagens
            docker compose --env-file "$ENV_FILE" pull

            # Rolling deploy
            docker compose --env-file "$ENV_FILE" up -d --remove-orphans

            # ── Smoke test backend ─────────────────────────────────────────
            # Executa wget DENTRO do container (isola falhas de TLS/DNS/rede externa)
            echo "Aguardando backend iniciar (max 60s)..."
            SUCCESS=false
            for i in $(seq 1 20); do
              STATUS=$(docker compose exec -T backend \
                wget -qO- http://localhost:8080/api/actuator/health 2>/dev/null \
                | grep -o '"status":"[^"]*"' | head -1 || true)
              if echo "$STATUS" | grep -q '"UP"'; then
                echo "Backend smoke test aprovado na tentativa $i."
                SUCCESS=true
                break
              fi
              echo "Tentativa $i: $STATUS — aguardando 3s..."
              sleep 3
            done || true

            # ── Smoke test frontend ────────────────────────────────────────
            # Executa wget DENTRO do container frontend (porta interna 3000, sem depender do nginx)
            echo "Verificando frontend no sub-path /prd-gra.ng/ ..."
            FRONT_OK=false
            for i in $(seq 1 10); do
              HTTP_CODE=$(docker compose exec -T frontend \
                wget -qO /dev/null --server-response http://127.0.0.1:3000/prd-gra.ng/ 2>&1 \
                | grep "HTTP/" | tail -1 | awk '{print $2}' || true)
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Frontend OK (HTTP 200) na tentativa $i."
                FRONT_OK=true
                break
              fi
              echo "Tentativa $i: HTTP $HTTP_CODE — aguardando 3s..."
              sleep 3
            done || true
            if [ "$FRONT_OK" = "false" ]; then
              echo "ERRO: frontend nao respondeu no sub-path /prd-gra.ng/ — abortando deploy."
              docker compose logs --tail=50 frontend || true
              exit 1
            fi

            echo "Ambos smoke tests internos aprovados. Verificando rollback..."

            # ── Rollback se backend falhou ─────────────────────────────────
            if [ "$SUCCESS" = "false" ]; then
              echo "Smoke test FALHOU. Iniciando rollback..."
              docker compose logs --tail=100 backend || true
              if [ -n "$PREVIOUS_SHA" ]; then
                echo "Revertendo para SHA anterior: ${PREVIOUS_SHA}"
                # Reescreve o .env completo com IMAGE_TAG anterior (evita sed in-place com regex frágil)
                {
                  printf 'DATABASE_URL="%s"\n'          "$DATABASE_URL"
                  printf 'JWT_SECRET="%s"\n'             "$JWT_SECRET"
                  printf 'NEXT_PUBLIC_API_URL="%s"\n'    "$NEXT_PUBLIC_API_URL"
                  printf 'CORS_ALLOWED_ORIGINS="%s"\n'   "$CORS_ALLOWED_ORIGINS"
                  printf 'DOMAIN="%s"\n'                 "$DOMAIN"
                  printf 'TRUSTED_PROXY_IP="%s"\n'       "$TRUSTED_PROXY_IP"
                  printf 'GHCR_REPO="%s"\n'              "$GHCR_REPO"
                  printf 'IMAGE_TAG="%s"\n'              "$PREVIOUS_SHA"
                } > "$ENV_FILE"
                chmod 600 "$ENV_FILE"
                docker compose --env-file "$ENV_FILE" pull
                docker compose --env-file "$ENV_FILE" up -d --remove-orphans
                echo "Rollback para ${PREVIOUS_SHA} concluido."
              else
                echo "Nenhuma versao anterior disponivel para rollback (primeiro deploy ou SHA nao identificado)."
              fi
              exit 1
            fi

            echo "Atualizando Traefik..."
            # Atualizar Traefik com o IP atual do nginx na rede easypanel
            # set +e localmente: docker inspect pode falhar se o container não estiver na rede easypanel
            # e a atribuição via $() propaga o exit code mesmo com || true sob set -e em algumas versões do bash
            set +e
            NGINX_IP=$(docker inspect prd-gra-nginx-1 --format '{{range $net,$conf := .NetworkSettings.Networks}}{{if eq $net "easypanel"}}{{$conf.IPAddress}}{{end}}{{end}}' 2>/dev/null)
            set -e
            TRAEFIK_CFG="/etc/easypanel/traefik/config/main.yaml"
            if [ -n "$NGINX_IP" ] && [ -f "$TRAEFIK_CFG" ]; then
              if command -v yq >/dev/null 2>&1; then
                yq -i ".http.services.prd-gra-nginx.loadBalancer.servers[0].url = \"http://${NGINX_IP}:8081\"" "$TRAEFIK_CFG" || true
                echo "Traefik atualizado para ${NGINX_IP}:8081 (via yq)"
              else
                # Fallback: sed em linha exata — funciona enquanto o formato da URL não tiver caracteres especiais de regex
                sed -i "s|url: \"http://[^\"]*:8081\"|url: \"http://${NGINX_IP}:8081\"|g" "$TRAEFIK_CFG" || true
                echo "Traefik atualizado para ${NGINX_IP}:8081 (via sed fallback)"
              fi
            else
              echo "Traefik: nginx não encontrado na rede easypanel ou cfg ausente — pulando atualização."
            fi

            # Limpeza de imagens antigas (mantém ultimas 72h)
            set +e
            docker image prune -f --filter "until=72h"
            set -e

            echo "Deploy concluido com sucesso: SHA=$IMAGE_TAG"
            echo "Smoke test externo sera executado pelo job e2e-smoke (continue-on-error: true)."

  # ─────────────────────────────────────────────────────────────
  e2e-smoke:
    name: E2E Smoke — Endpoint Público
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Smoke externo pode falhar por DNS/Traefik desatualizado sem que o app esteja quebrado.
    # O deploy interno já foi validado — não bloquear o pipeline por falha de rede externa.
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Aguardar estabilização (15s)
        run: sleep 15

      - name: Smoke — API health público
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "Testando https://${DOMAIN}/api/actuator/health ..."
          for i in $(seq 1 6); do
            STATUS=$(curl -sf --max-time 10 "https://${DOMAIN}/api/actuator/health" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status',''))" 2>/dev/null || echo "")
            if [ "$STATUS" = "UP" ]; then
              echo "API health: UP (tentativa $i)"
              break
            fi
            echo "Tentativa $i: '$STATUS' — aguardando 5s..."
            sleep 5
            if [ "$i" = "6" ]; then
              echo "ERRO: API não respondeu UP após 6 tentativas."
              exit 1
            fi
          done

      - name: Smoke — Frontend acessível
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "Testando https://${DOMAIN}/prd-gra.ng/ ..."
          HTTP_CODE=$(curl -o /dev/null -sw "%{http_code}" --max-time 15 \
            --location "https://${DOMAIN}/prd-gra.ng/" 2>/dev/null || echo "000")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERRO: frontend retornou HTTP $HTTP_CODE (esperado 200)."
            exit 1
          fi
          echo "Frontend OK: HTTP 200"

      - name: Smoke — Redirect raiz
        env:
          DOMAIN: ${{ secrets.DOMAIN }}
        run: |
          echo "Testando redirect https://${DOMAIN}/ → /prd-gra.ng/ ..."
          REDIRECT_LOC=$(curl -o /dev/null -sw "%{redirect_url}" --max-time 10 \
            "https://${DOMAIN}/" 2>/dev/null || echo "")
          echo "Redirect para: $REDIRECT_LOC"
          if ! echo "$REDIRECT_LOC" | grep -q "prd-gra.ng"; then
            echo "AVISO: redirect da raiz não aponta para /prd-gra.ng/ — verificar nginx."
          else
            echo "Redirect OK"
          fi
