spring:
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      keepalive-time: 120000
      idle-timeout: 300000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
    caffeine:
      # maximumSize: evita crescimento ilimitado de entradas em memória
      # expireAfterWrite: invalida entradas 5 min após escrita — dados nunca ficam obsoletos por mais de 5 min
      spec: maximumSize=500,expireAfterWrite=300s

server:
  port: 8080
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000       # 15 minutos — access token curto, refresh faz rotação
  refresh-token:
    expiration-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    trusted-proxy: ${TRUSTED_PROXY_IP:127.0.0.1}
    max-requests: 10

logging:
  level:
    ng.prdgra: INFO
    org.springframework.security: WARN
