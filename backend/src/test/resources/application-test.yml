# Perfil "test" — usado por PrdIntegrationTest via @ActiveProfiles("test").
# O datasource real e injetado pelo @DynamicPropertySource do Testcontainers,
# sobrescrevendo spring.datasource.* abaixo. Flyway e ddl-auto sao reabilitados
# tambem via @DynamicPropertySource.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/testdb_placeholder
    driver-class-name: org.postgresql.Driver
    username: test
    password: test
    hikari:
      connection-timeout: 5000
      maximum-pool-size: 2
      initialization-fail-timeout: -1
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: dGVzdC1zZWNyZXQtcGFyYS1jaS1taW5pbW8tMzItY2hhcmFjdGVycw==
    expiration-ms: 900000
  refresh-token:
    expiration-days: 30
  cors:
    allowed-origins: http://localhost:3000
  rate-limit:
    trusted-proxy: 127.0.0.1
    max-requests: 100
