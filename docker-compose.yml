services:
  nginx:
    image: ${GHCR_REPO}/nginx:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Porta 8081 interna — Traefik do EasyPanel ocupa 80/443 nesta VPS.
    # O Traefik roteia xavierbr-vps.tech -> nginx:8081 via traefik-config.yml.
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - certbot-certs:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - frontend-net
      - backend-net
      - easypanel
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

  frontend:
    image: ${GHCR_REPO}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NODE_ENV: production
    networks:
      - frontend-net
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /prd-gra.ng/ HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' | nc -w3 127.0.0.1 3000 | head -1 | grep -qE 'HTTP/1\\.[01] [2-4]'"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ${GHCR_REPO}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_PROFILES_ACTIVE: prod
      TRUSTED_PROXY_IP: ${TRUSTED_PROXY_IP:-127.0.0.1}
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s

volumes:
  certbot-certs:
  certbot-www:

networks:
  # frontend-net: isolada — apenas nginx e frontend se comunicam aqui
  frontend-net:
    driver: bridge
    internal: true

  # backend-net: permite saída à internet — necessário para o backend acessar o Neon (PostgreSQL remoto)
  backend-net:
    driver: bridge

  # easypanel: rede externa gerenciada pelo EasyPanel/Traefik — permite roteamento pelo Traefik
  easypanel:
    external: true
