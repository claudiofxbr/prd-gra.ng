user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss
               application/atom+xml image/svg+xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=app:10m rate=60r/m;

    # Porta 8081 — TLS terminado pelo Traefik do EasyPanel upstream.
    # Traefik roteia xavierbr-vps.tech -> http://nginx:8081 e injeta X-Forwarded-Proto=https.
    server {
        listen 8081;
        server_name _;

        # Security headers — HSTS, X-Content-Type e demais aplicados pelo Traefik via middleware
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Backend API
        location /api/ {
            limit_req zone=api burst=10 nodelay;
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_connect_timeout 10s;
            proxy_read_timeout 30s;
            proxy_send_timeout 10s;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
        }

        # Frontend PRD-GRA.NG sob sub-path /prd-gra.ng/
        # proxy_redirect: reescreve Location do 308 que o Next.js emite
        # quando recebe /prd-gra.ng/ (com slash) — impede loop de redirect
        location /prd-gra.ng/ {
            limit_req zone=app burst=20 nodelay;
            proxy_pass http://frontend:3000/prd-gra.ng/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
            proxy_buffer_size 16k;
            proxy_buffers 4 16k;
            # Reescreve Location: /prd-gra.ng -> /prd-gra.ng/ para evitar loop
            proxy_redirect ~^(https?://[^/]+)?/prd-gra\.ng$ $scheme://$host/prd-gra.ng/;
        }

        # Rota sem trailing slash: Next.js pode redirecionar para esta
        location = /prd-gra.ng {
            return 301 /prd-gra.ng/;
        }

        # Redirect raiz para o sub-path da aplicacao
        location = / {
            return 302 /prd-gra.ng/;
        }
    }
}
